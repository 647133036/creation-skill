name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        package:
          - ffmpeg-skill
          - gif-factory
          - cinecode
          - claude-animated-shorts
          - rea-video
          - craft-anything
          - unlose
          - superpowers
          - open-code-review
          - rea
          - graphify
          - hallmark
          - impeccable
          - hyperframes
          - security-audit-skill
          - claude-seo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python 3.15
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev zlib1g-dev \
            libbz2-dev libreadline-dev libsqlite3-dev libncursesw5-dev xz-utils \
            tk-dev libxml2-dev libffi-dev liblzma-dev uuid-dev
          curl -sL https://www.python.org/ftp/python/3.15.2/Python-3.15.2.tgz | tar xz
          cd Python-3.15.2 && ./configure --prefix=/opt/python3.15 && make -j"$(nproc)" && sudo make install
      - name: Install ffmpeg
        run: |
          curl -sL -o /tmp/ffmpeg.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz"
          tar -xf /tmp/ffmpeg.tar.xz
          sudo cp ffmpeg-n9.0-linux64-gpl-9.0/bin/ff* /usr/local/bin/
      - name: Install Rust
        if: matrix.package == 'craft-anything' || matrix.package == 'impeccable'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
          profile: "minimal"
      - name: Install bun
        if: matrix.package == 'hyperframes'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"
      - name: Install Go
        if: matrix.package == 'open-code-review'
        run: |
          # go.mod requires go 1.26; GOTOOLCHAIN=auto handles fetching during check
      - name: Check ${{ matrix.package }}
        run: bash tools/check-package.sh "${{ matrix.package }}" /opt/python3.15/bin/python3
